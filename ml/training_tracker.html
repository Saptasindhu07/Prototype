<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Research Atlas · Training live</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101619;color:#edf5f2}*{box-sizing:border-box}body{margin:0;padding:32px 22px}main{max-width:800px;margin:6vh auto}header{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.eyebrow{letter-spacing:.14em;font-size:12px;color:#a9c4bb}h1{font-size:clamp(27px,5vw,40px);letter-spacing:-.04em;margin:12px 0 35px;font-weight:550}.status{font-size:13px;color:#b2decc}.status::before{content:'●';margin-right:8px}.hero{padding:27px 0;border-top:1px solid #304039;border-bottom:1px solid #304039}.label{display:flex;align-items:baseline;justify-content:space-between;gap:14px}.label span{color:#b6cbc2}.percent{font-size:clamp(42px,9vw,70px);font-weight:550;letter-spacing:-.06em}progress{display:block;appearance:none;width:100%;height:13px;border:0;border-radius:10px;overflow:hidden;margin:20px 0;background:#263c33;color:#8eddb5}progress::-webkit-progress-bar{background:#263c33}progress::-webkit-progress-value{background:#8eddb5;transition:width .35s ease}progress::-moz-progress-bar{background:#8eddb5}.muted{color:#a9bdb4;font-size:14px;line-height:1.6}.row{display:flex;justify-content:space-between;gap:24px;align-items:center;padding:24px 0}.row strong{font-size:24px;font-weight:500}.small-progress{height:7px;margin:10px 0 0}.phases{padding:20px 0;border-top:1px solid #304039}.phase{display:flex;justify-content:space-between;gap:15px;padding:12px 0;font-size:14px}.phase span:last-child{color:#b2decc;text-align:right}footer{border-top:1px solid #304039;padding-top:20px}#error{color:#ffcbad}button{background:#20382d;color:#edf5f2;border:1px solid #547060;border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #8eddb5;outline-offset:3px}@media(max-width:480px){body{padding:20px}main{margin:2vh auto}.label{align-items:center}.row{align-items:flex-start}h1{margin-bottom:25px}}@media(prefers-reduced-motion:reduce){progress::-webkit-progress-value{transition:none}}
</style></head><body><main>
<header><div class="eyebrow">RESEARCH ATLAS / BGE</div><div id="connection" class="status" role="status">Connecting…</div></header>
<h1>Model training, live.</h1>
<section class="hero" aria-label="Combined training progress"><div class="label"><span>Both full epochs</span><strong class="percent" id="overall">—</strong></div><progress id="overallBar" max="100" value="0" aria-label="Combined training percentage"></progress><div class="muted">Training progress only. Evaluation and paper indexing follow separately.</div></section>
<section aria-label="Epoch progress"><div class="row"><div><div class="muted">Epoch 1</div><strong id="first">—</strong></div><div><div class="muted">Epoch 2</div><strong id="second">—</strong></div><div><div class="muted">Batches</div><strong id="batches">—</strong></div></div><progress id="epochBar" class="small-progress" max="100" value="0" aria-label="Second epoch percentage"></progress></section>
<section class="phases" aria-label="Completion pipeline"><div class="phase"><span>Current stage</span><span id="phase">Reading logs…</span></div><div id="indexSection" hidden><div class="phase"><span>Paper index</span><span id="indexLabel"></span></div><progress id="indexBar" max="100" value="0" aria-label="Paper index percentage"></progress></div><div class="phase"><span>Live app connection</span><span id="appConnection">Off · joint connection later</span></div></section>
<footer><p class="muted" id="updated">Auto-refresh every 3 seconds.</p><p id="error" role="alert" hidden></p><button id="refresh" type="button">Refresh now</button></footer>
</main><script>
const byId=id=>document.getElementById(id);
const names={'waiting-for-training':'Training second epoch','validating-and-saving-checkpoint':'Validation & checkpoint save','training-complete':'Training complete','verifying-checkpoint':'Checking saved checkpoint','evaluating-frozen-checkpoint':'Held-out evaluation','building-matching-paper-index':'Building paper index','verifying-inference-contract':'Verifying model API','ready-for-joint-connection':'Ready for joint connection','training-failed':'Training failed','failed':'Finalization needs attention'};
let timer,busy=false;
async function refresh(){if(busy)return;busy=true;clearTimeout(timer);try{
const response=await fetch('/api/status',{cache:'no-store',signal:AbortSignal.timeout(6000)});if(!response.ok)throw Error('Status unavailable');const data=await response.json();
byId('overall').textContent=data.overallPercent.toFixed(1)+'%';byId('overallBar').value=data.overallPercent;
byId('first').textContent=data.priorComplete?'100% ✓':'Pending';byId('second').textContent=data.epochPercent.toFixed(1)+'%';byId('epochBar').value=data.epochPercent;byId('batches').textContent=data.step+' / '+data.totalSteps;
byId('phase').textContent=names[data.phase]||data.phase;byId('connection').textContent=data.error?'Needs attention':data.stale?'No recent batch update':'Live · refreshing';
byId('appConnection').textContent=data.liveConnectionEnabled?'Enabled · live flow verified':'Off · joint connection later';
byId('indexSection').hidden=!data.indexProgress;if(data.indexProgress){byId('indexLabel').textContent=data.indexProgress.percent+'% · '+data.indexProgress.completed+' / '+data.indexProgress.total+' batches';byId('indexBar').value=data.indexProgress.percent;}
byId('updated').textContent='Checked '+new Date(data.updatedAt).toLocaleTimeString()+'. Last batch '+(data.lastBatchAgeSeconds??'—')+'s ago. Refreshes every 3s.';
byId('error').hidden=!data.error;byId('error').textContent=data.error||'';
}catch(error){byId('connection').textContent='Connection lost';byId('error').hidden=false;byId('error').textContent='Cannot read live progress. Displayed values may be outdated; retrying automatically.';}finally{busy=false;timer=setTimeout(refresh,3000)}}
byId('refresh').addEventListener('click',refresh);refresh();
</script></body></html>
